# On a version tag (git tag v1.0.0 && git push --tags): publish the Docker image to GitHub's registry and
# both packages to PyPI. PyPI uses trusted publishing: once, on pypi.org, add a "pending publisher" for each
# project (ferret-search and ferret-crawler) with owner MayankPunghal, repository ferret, workflow
# release.yml, environment pypi. No token is stored here.
name: Release
on:
  push:
    tags: ["v*"]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mayankpunghal/ferret-search:${{ github.ref_name }}
            ghcr.io/mayankpunghal/ferret-search:latest

  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --all-packages -o dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true  # ferret-crawler keeps its version until the crawler changes
