# Tests on Linux, Windows and macOS (each starts its own embedded PostgreSQL), and the UI walkthrough on Linux.
name: CI
on:
  push:
  pull_request:
  workflow_call:  # release.yml: the commit being released must pass
    inputs:
      ref:
        type: string
        required: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@v6
      # windows-latest runs jobs as an administrator, so the embedded PostgreSQL's initdb drops to a restricted
      # token that cannot reach the runner's D:/a folders ("could not create directory ...: File exists"). The
      # same database starts fine from the user profile (the installer job), so the venv and test data go there.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "UV_PROJECT_ENVIRONMENT=$env:USERPROFILE\ks-venv" >> $env:GITHUB_ENV
          "TEST_TMP=$env:USERPROFILE\pytest" >> $env:GITHUB_ENV
      - run: uv sync
      - uses: actions/cache@v4
        with:
          path: data/models
          key: test-models-v1
      - run: uv run ferret download-model --model BAAI/bge-small-en-v1.5 --reranker Xenova/ms-marco-MiniLM-L-6-v2
      - shell: bash
        run: uv run pytest -q --basetemp="${TEST_TMP:-${{ runner.temp }}/pytest}"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - run: docker build -t ferret-search:ci .
      - name: llama.cpp's Linux build finds its libraries in the image
        run: |
          docker run --rm ferret-search:ci sh -c '/app/.venv/bin/python -c "from pathlib import Path; from knowledge_search import enrich; enrich.fetch_build(Path(\"/tmp/l\"))" > /dev/null && ldd $(find /tmp/l -name llama-server) | tee /tmp/ldd.txt; ! grep "not found" /tmp/ldd.txt'
      - name: One container starts, loads the samples and answers a search
        run: |
          docker run -d --name ferret -p 8000:8000 -e KS_ENRICH_ENABLED=false ferret-search:ci
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8000/healthz > /dev/null && break; sleep 2; done
          docker exec ferret /app/.venv/bin/ferret demo
          token=$(curl -sf -X POST http://127.0.0.1:8000/api/auth/login -H 'Content-Type: application/json'             -d '{"username":"alice","password":"demo-password-alice"}' | python3 -c 'import json,sys;print(json.load(sys.stdin)["token"])')
          curl -sf -X POST http://127.0.0.1:8000/api/search -H "Authorization: Bearer $token" -H 'Content-Type: application/json'             -d '{"query":"ERR-PAY-4012"}' | python3 -c 'import json,sys;r=json.load(sys.stdin);print(r["outcome"]);assert r["outcome"]=="evidence_found"'
          docker images ferret-search:ci --format '{{.Size}}'
      - if: failure()
        run: docker logs ferret | tail -100

  ui:
    runs-on: ubuntu-latest
    env:
      KS_DATA_DIR: ./data/ui-check
      KS_ENRICH_ENABLED: "false"  # no 3 GB summary model download in CI
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - uses: actions/cache@v4
        with:
          path: data/models
          key: default-models-v1
      - run: uv run ferret download-model
      - name: Start a demo server
        shell: bash
        run: |
          uv run ferret serve --port 8000 > serve.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8000/ > /dev/null && break; sleep 2; done
          uv run ferret demo
      - run: uv run --with playwright playwright install --with-deps chromium
      - run: mkdir -p ui-shots && uv run --with playwright python scripts/ui_check.py ui-shots http://127.0.0.1:8000
      - if: failure()
        run: tail -100 serve.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-shots
          path: ui-shots
      # the demo server runs under `uv run` and holds uv's cache lock: stop it, or setup-uv's clean-up times out
      - if: always()
        run: pkill -f "ferret serve" || true
