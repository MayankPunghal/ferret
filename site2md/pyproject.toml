[project]
name = "ferret-crawler"
version = "1.1.1"
description = "Save a website or intranet as Markdown files, one per page (for search indexes and LLM tools)"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.48"]

[project.scripts]
ferret-crawler = "site2md:main"
site2md = "site2md:main"

[project.urls]
Homepage = "https://github.com/MayankPunghal/ferret"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "site2md"
