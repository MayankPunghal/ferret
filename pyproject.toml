[project]
name = "knowledge-search"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Claude", email = "noreply@anthropic.com" }
]
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi==25.1.0",
    "fastapi==0.159.1",
    "fastembed==0.9.0",
    "markdown-it-py==4.2.0",
    "pgvector==0.5.1",
    "pixeltable-pgserver==0.6.0",
    "psycopg-pool==3.3.3",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.16.1",
    "pypdf==6.21.2",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "uvicorn[standard]==0.54.0",
]

[project.scripts]
knowledge-search = "knowledge_search:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]
eval = [
    "pyarrow==22.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
