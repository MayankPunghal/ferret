[project]
name = "ferret-search"
version = "1.1.3"
description = "Offline, permission-aware knowledge search for technical teams"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Mayank Punghal" }
]
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi==25.1.0",
    "fastapi==0.159.1",
    "fastembed==0.9.0",
    "httpx==0.28.1",  # in-process calls from the MCP endpoint (mcp.py)
    "markdown-it-py==4.2.0",
    "pgvector==0.5.1",
    "pixeltable-pgserver==0.6.0",
    "psycopg-pool==3.3.3",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.16.1",
    "pypdfium2==5.14.0",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "ferret-crawler==1.1.2",  # site2md/, the crawler (import name site2md; "site2md" is taken on PyPI)
    "playwright==1.64.1",  # the crawler drives the installed Chrome or Edge for sites that need a sign-in
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
tray = ["pystray==0.19.5", "pillow>=11"]  # the Windows app's tray icon (tray.py, packaging/)

[project.scripts]
ferret = "knowledge_search:main"
knowledge-search = "knowledge_search:main"  # the earlier name, kept so existing setups keep working

[project.urls]
Homepage = "https://github.com/MayankPunghal/ferret"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "knowledge_search"

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mcp==2.3.0",
    "pytest==9.1.1",
]
eval = [
    "pyarrow==22.0.0",
]

[tool.uv.workspace]
members = ["site2md"]

[tool.uv.sources]
ferret-crawler = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
